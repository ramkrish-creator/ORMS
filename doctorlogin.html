<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #e0f7fa, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            width: 450px;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-control {
            height: 50px;
        }
        .btn-lg {
            width: 100%;
            height: 50px;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="text-center mb-4">Doctor Login</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="userId" class="form-label">Doctor ID</label>
                <input type="text" class="form-control" id="userId" placeholder="Enter your Doctor ID" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <!-- Add/update this script section -->
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('errorMessage');
        
        // Doctor credentials with specific dashboard pages
        const doctors = {
            'doctor1': { 
                password: 'doc123', 
                name: 'Dr. A. Kumar', 
                specialty: 'Cardiologist',
                dashboard: 'doctorpage1.html',
                email: 'akumar@orms.com',
                appointments: [
                    { time: '9:00 AM', patient: 'Ravi Sharma', issue: 'Chest Pain', status: 'Pending' },
                    { time: '10:00 AM', patient: 'Sunita Devi', issue: 'Checkup', status: 'Done' },
                    { time: '11:30 AM', patient: 'Arjun R.', issue: 'Follow-up', status: 'Ongoing' }
                ]
            },
            'doctor2': { 
                password: 'doc456', 
                name: 'Dr. S. Patel', 
                specialty: 'Neurologist',
                dashboard: 'doctorpage2.html',
                email: 'spatel@orms.com',
                appointments: [
                    { time: '1:00 PM', patient: 'Rajkumar', issue: 'Chest Pain', status: 'Pending' },
                    { time: '2:00 PM', patient: 'Ram', issue: 'Checkup', status: 'Done' },
                    { time: '3:30 PM', patient: 'Raveena', issue: 'Follow-up', status: 'Ongoing' }
                ]
            }
        };
        
        if (doctors[userId] && doctors[userId].password === password) {
            // Store complete doctor data
            sessionStorage.setItem('currentDoctor', JSON.stringify({
                id: userId,
                ...doctors[userId] // Include all doctor properties
            }));
            
            window.location.href = doctors[userId].dashboard;
        } else {
            errorMessage.textContent = 'Invalid Doctor ID or Password';
        }
    });
</script>
</body>
</html>
