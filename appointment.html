<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Booking</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .time-slot-label {
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
        }
        input[name="time"] {
            display: none;
        }
        input[name="time"]:checked + .time-slot-label {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book Your Appointment</h1>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="date">Select Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label>Select Time Slot:</label>
            <div class="time-slots">
                <!-- Time slots using radio buttons -->
                <input type="radio" id="time1" name="time" value="08:00 AM" required>
                <label class="time-slot-label" for="time1">08:00 AM</label>

                <input type="radio" id="time2" name="time" value="08:20 AM">
                <label class="time-slot-label" for="time2">08:20 AM</label>

                <input type="radio" id="time3" name="time" value="08:40 AM">
                <label class="time-slot-label" for="time3">08:40 AM</label>

                <input type="radio" id="time4" name="time" value="09:00 AM">
                <label class="time-slot-label" for="time4">09:00 AM</label>

                <input type="radio" id="time5" name="time" value="09:20 AM">
                <label class="time-slot-label" for="time5">09:20 AM</label>

                <input type="radio" id="time6" name="time" value="09:40 AM">
                <label class="time-slot-label" for="time6">09:40 AM</label>

                <input type="radio" id="time7" name="time" value="10:00 AM">
                <label class="time-slot-label" for="time7">10:00 AM</label>

                <input type="radio" id="time8" name="time" value="10:20 AM">
                <label class="time-slot-label" for="time8">10:20 AM</label>

                <input type="radio" id="time9" name="time" value="10:40 AM">
                <label class="time-slot-label" for="time9">10:40 AM</label>

                <input type="radio" id="time10" name="time" value="11:00 AM">
                <label class="time-slot-label" for="time10">11:00 AM</label>

                <input type="radio" id="time11" name="time" value="11:20 AM">
                <label class="time-slot-label" for="time11">11:20 AM</label>

                <input type="radio" id="time12" name="time" value="11:40 AM">
                <label class="time-slot-label" for="time12">11:40 AM</label>

                <input type="radio" id="time13" name="time" value="12:00 PM">
                <label class="time-slot-label" for="time13">12:00 PM</label>

                <input type="radio" id="time14" name="time" value="05:00 PM">
                <label class="time-slot-label" for="time14">05:00 PM</label>

                <input type="radio" id="time15" name="time" value="05:20 PM">
                <label class="time-slot-label" for="time15">05:20 PM</label>

                <input type="radio" id="time16" name="time" value="05:40 PM">
                <label class="time-slot-label" for="time16">05:40 PM</label>

                <input type="radio" id="time17" name="time" value="06:00 PM">
                <label class="time-slot-label" for="time17">06:00 PM</label>

                <input type="radio" id="time18" name="time" value="06:20 PM">
                <label class="time-slot-label" for="time18">06:20 PM</label>

                <input type="radio" id="time19" name="time" value="06:40 PM">
                <label class="time-slot-label" for="time19">06:40 PM</label>

                <input type="radio" id="time20" name="time" value="07:00 PM">
                <label class="time-slot-label" for="time20">07:00 PM</label>

                <input type="radio" id="time21" name="time" value="07:20 PM">
                <label class="time-slot-label" for="time21">07:20 PM</label>

                <input type="radio" id="time22" name="time" value="07:40 PM">
                <label class="time-slot-label" for="time22">07:40 PM</label>

                <input type="radio" id="time23" name="time" value="08:00 PM">
                <label class="time-slot-label" for="time23">08:00 PM</label>

                <input type="radio" id="time24" name="time" value="08:20 PM">
                <label class="time-slot-label" for="time24">08:20 PM</label>

                <input type="radio" id="time25" name="time" value="08:40 PM">
                <label class="time-slot-label" for="time25">08:40 PM</label>

                <input type="radio" id="time26" name="time" value="09:00 PM">
                <label class="time-slot-label" for="time26">09:00 PM</label>
            </div>
            
            <button type="submit">Book Appointment</button>
        </form>
    </div>
<script>
    // Set min attribute on date input to today's date
    const dateInput = document.getElementById('date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    // Add a patient ID field
    const form = document.querySelector('form');
    const nameLabel = document.querySelector('label[for="name"]');
    
    const patientIdLabel = document.createElement('label');
    patientIdLabel.setAttribute('for', 'patientId');
    patientIdLabel.textContent = 'Patient ID (>= 1001):';

    const patientIdInput = document.createElement('input');
    patientIdInput.setAttribute('type', 'number');
    patientIdInput.setAttribute('id', 'patientId');
    patientIdInput.setAttribute('name', 'patientId');
    patientIdInput.setAttribute('required', true);
    patientIdInput.setAttribute('min', '1001');

    const errorMsg = document.createElement('p');
    errorMsg.style.color = 'red';
    errorMsg.style.display = 'none';

    form.insertBefore(patientIdLabel, nameLabel);
    form.insertBefore(patientIdInput, nameLabel);
    form.insertBefore(errorMsg, nameLabel);

    form.addEventListener('submit', function(event) {
        const patientId = parseInt(patientIdInput.value);

        if (isNaN(patientId) || patientId < 1001) {
            event.preventDefault();
            errorMsg.textContent = 'Error: Patient ID must be a number greater than or equal to 1001.';
            errorMsg.style.display = 'block';
        } else {
            errorMsg.style.display = 'none';
        }
    });
</script>

</body>
</html>
