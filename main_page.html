<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Book Your Appointment</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="date">Select Date:</label>
            <input type="date" id="date" name="date" required>
            
            <label>Select Time Slot:</label>
            <div class="time-slots">
                <!-- Time slots from 8:00 AM to 12:00 PM -->
                <button type="button" value="08:00 AM">08:00 AM</button>
                <button type="button" value="08:20 AM">08:20 AM</button>
                <button type="button" value="08:40 AM">08:40 AM</button>
                <button type="button" value="09:00 AM">09:00 AM</button>
                <button type="button" value="09:20 AM">09:20 AM</button>
                <button type="button" value="09:40 AM">09:40 AM</button>
                <button type="button" value="10:00 AM">10:00 AM</button>
                <button type="button" value="10:20 AM">10:20 AM</button>
                <button type="button" value="10:40 AM">10:40 AM</button>
                <button type="button" value="11:00 AM">11:00 AM</button>
                <button type="button" value="11:20 AM">11:20 AM</button>
                <button type="button" value="11:40 AM">11:40 AM</button>
                <button type="button" value="12:00 PM">12:00 PM</button>

                <!-- Time slots from 5:00 PM to 9:00 PM -->
                <button type="button" value="05:00 PM">05:00 PM</button>
                <button type="button" value="05:20 PM">05:20 PM</button>
                <button type="button" value="05:40 PM">05:40 PM</button>
                <button type="button" value="06:00 PM">06:00 PM</button>
                <button type="button" value="06:20 PM">06:20 PM</button>
                <button type="button" value="06:40 PM">06:40 PM</button>
                <button type="button" value="07:00 PM">07:00 PM</button>
                <button type="button" value="07:20 PM">07:20 PM</button>
                <button type="button" value="07:40 PM">07:40 PM</button>
                <button type="button" value="08:00 PM">08:00 PM</button>
                <button type="button" value="08:20 PM">08:20 PM</button>
                <button type="button" value="08:40 PM">08:40 PM</button>
                <button type="button" value="09:00 PM">09:00 PM</button>
            </div>
            
            <button type="submit">Book Appointment</button>
        </form>
    </div>
</body>
</html>
